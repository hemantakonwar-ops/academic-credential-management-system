version: '3.8'

services:
  # ── Backend API ───────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: acms-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - server/.env
    environment:
      - NODE_ENV=production
    depends_on:
      - mongo
    networks:
      - acms-network

  # ── Frontend (production) ─────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    container_name: acms-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - acms-network

  # ── MongoDB ───────────────────────────────
  mongo:
    image: mongo:6
    container_name: acms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - acms-mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: acms
    networks:
      - acms-network

volumes:
  acms-mongo-data:

networks:
  acms-network:
    driver: bridge
